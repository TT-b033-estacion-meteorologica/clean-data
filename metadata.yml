calidad:
  linaje:
    enunciado: La estación meteorológica registra mediciones cada 15 minutos. Un proceso programado con
      Cloud Scheduler extrae diariamente (≈01:00 h, hora de la Ciudad de México) los registros del día
      previo y los almacena sin alteración en la tabla raw_weather_data de Cloud SQL (PostgreSQL). Un
      servicio de Cloud Run (≈13:00 h) consulta las vistas SQL de limpieza y temáticas y publica los resultados
      en este repositorio en CSV mensuales.
  nivel: '3'
  pasos_proceso:
    descripcion: '1. Extracción HTTP desde la consola de la estación. 2. Carga sin transformación en raw_weather_data
      (todos los campos como texto); la restricción de unicidad fecha-hora evita registros duplicados.
      3. Limpieza mediante la vista vw_clean_weather: valores ''---'' a NULL con NULLIF, conversión de
      tipos (VARCHAR a NUMERIC, DATE y TIME) y fecha con TO_DATE(''DD:MM:YYYY''). 4. Corrección de la
      presión barométrica con la tabla ajustes_barometro (+192.1 mmHg entre el 3 de julio de 2026 a las
      00:00 h y el 20 de octubre de 2026 a las 09:15 h); las lecturas originales se conservan en RAW.
      5. Separación temática en vistas (temperatura y humedad, viento, lluvia y presión). 6. Exportación
      a CSV mensual en GitHub.'
    tecnologia:
      hardware: Google Cloud Run (contenedor on-demand)
      software: PostgreSQL 15, Python 3.11, Flask, pandas
    fuentes:
    - Estación meteorológica Davis Vantage Vue (consola con acceso HTTP)
    - Cloud SQL PostgreSQL - Google Cloud Platform
  control_calidad:
    criterio:
      completitud:
        subcriterio: Omisión
        ambito: Valores faltantes de la estación ('---') representados como NULL
      consistencia_logica:
        subcriterio: Consistencia de formato
        ambito: 'Conversión de tipos: VARCHAR a NUMERIC, DATE y TIME; sin duplicados de fecha-hora'
      exactitud_tematica:
        subcriterio: Exactitud de atributos cuantitativos
        ambito: 'Presión barométrica: ajuste constante documentado en bar_ajuste_mmhg y ajuste_mmhg'
    descripcion: 'Los valores ''---'' se convierten a NULL y no se descartan registros. Del 2026-04-19
      al 2026-11-09: 193 de 205 días con datos (94.1 %) y 18043 de 19680 registros esperados (91.7 %).
      Se esperan 96 registros por día; la mayoría de los días completos tiene 95 (ver limitaciones).'
  limitaciones_conocidas:
  - 'Presión barométrica corregida: por una configuración incorrecta del barómetro (BARCAL) hubo una discontinuidad
    desde el 3 de julio de 2026. En CLEAN se aplicó un ajuste constante de +192.1 mmHg entre el 3 de julio
    de 2026 a las 00:00 h y el 20 de octubre de 2026 a las 09:15 h; el valor aplicado se publica en bar_ajuste_mmhg
    (clean_weather) y ajuste_mmhg (clean_presion), y las lecturas originales se conservan sin modificar
    en el repositorio raw-data.'
  - La presión se expresa en mmHg, la unidad configurada en la consola. En clean_presion las columnas
    presion_hpa y variacion_hpa también están en mmHg, no en hPa.
  - Temperatura y humedad relativa se reportan sin decimales (resolución efectiva de 1 °C y 1 %).
  - El registro de las 00:00 h de cada día no se captura, por lo que la mayoría de los días completos
    tiene 95 registros en lugar de 96.
  - 'Hay días sin datos que ya no pueden recuperarse: 31 de mayo; 19, 23, 24 y 29 de junio; 3, 18 y 19
    de julio; 11 de agosto, y 7, 15 y 16 de septiembre de 2026. Los días de la puesta en marcha (24 de
    abril al 2 de mayo de 2026) y algunos días aislados están incompletos.'
  - 'Viento: cerca de dos tercios de los intervalos registran 0 km/h y alrededor de un tercio no tiene
    dirección (calma); el anemómetro podría estar resguardado, por lo que los datos reflejan la circulación
    local.'
  - Radiación solar, índice UV y evapotranspiración no están disponibles (sensores no instalados) y no
    se incluyen en las vistas limpias.
  - Los valores atípicos no se marcan ni se eliminan en los datos publicados. En cada captura, el sistema
    revisa los registros nuevos (rangos físicos, saltos de presión y sensores sin lectura) y envía una
    alerta al equipo para revisarlos.
entidades_atributos:
  descripcion_general: '5 vistas temáticas en CSV mensual. Cada registro es una medición de 15 minutos.
    Unidades: temperatura en °C, humedad relativa en %, presión en mmHg, velocidad del viento en km/h,
    precipitación en mm y tasa de precipitación en mm/h.'
  entidades:
  - archivo: AAAA/MM/clean_weather_AAAAMM.csv
    variables: id, fecha, hora, temp_out, hi_temp, low_temp, in_temp, in_hum_pct, out_hum_pct, rain, rain_rate,
      bar, wind_speed, hi_speed, hi_dir, wind_dir, temp_units, bar_units, wind_units, rain_units, bar_ajuste_mmhg
    unidades: Varias
  - archivo: AAAA/MM/clean_temperatura_AAAAMM.csv
    variables: id, fecha, hora, temp_exterior, temp_max, temp_min, temp_interior, humedad_exterior, humedad_interior
    unidades: °C, %
  - archivo: AAAA/MM/clean_viento_AAAAMM.csv
    variables: id, fecha, hora, velocidad_kmh, rafaga_kmh, direccion, direccion_rafaga
    unidades: km/h, cardinal
  - archivo: AAAA/MM/clean_lluvia_AAAAMM.csv
    variables: id, fecha, hora, lluvia_mm, tasa_mm_hr
    unidades: mm, mm/h
  - archivo: AAAA/MM/clean_presion_AAAAMM.csv
    variables: id, fecha, hora, presion_hpa, variacion_hpa, tendencia, ajuste_mmhg
    unidades: mmHg
  cita_detalle: Ver README.md en la raíz del repositorio para el diccionario de datos, la metodología
    de limpieza y las limitaciones por vista.
