calidad:
  linaje:
    enunciado: La estación meteorológica registra mediciones cada 15 minutos. Un proceso programado con
      Cloud Scheduler extrae diariamente (≈12:00 h, hora de la Ciudad de México) los registros del día
      previo y los almacena sin alteración en la tabla raw_weather_data de Cloud SQL (PostgreSQL). Un
      servicio de Cloud Run (≈13:00 h) consulta las vistas SQL de limpieza y temáticas y publica los resultados
      en este repositorio en CSV mensuales.
  nivel: '3'
  pasos_proceso:
    descripcion: '1. Extracción HTTP desde la consola de la estación. 2. Carga sin transformación en raw_weather_data
      (todos los campos como texto); la restricción de unicidad fecha-hora evita registros duplicados.
      3. Limpieza mediante la vista vw_clean_weather: valores ''---'' a NULL con NULLIF, conversión de
      tipos (VARCHAR a NUMERIC, DATE y TIME) y fecha con TO_DATE(''DD:MM:YYYY''). 4. Separación temática
      en vistas (temperatura y humedad, viento, lluvia y presión). 5. Exportación a CSV mensual en GitHub.'
    tecnologia:
      hardware: Google Cloud Run (contenedor on-demand)
      software: PostgreSQL 14, Python 3.11, Flask, pandas
    fuentes:
    - Estación meteorológica Davis Vantage Vue (consola con acceso HTTP)
    - Cloud SQL PostgreSQL - Google Cloud Platform
  control_calidad:
    criterio:
      completitud:
        subcriterio: Omisión
        ambito: Valores faltantes de la estación ('---') representados como NULL
      consistencia_logica:
        subcriterio: Consistencia de formato
        ambito: 'Conversión de tipos: VARCHAR a NUMERIC, DATE y TIME; sin duplicados de fecha-hora'
    descripcion: 'Los valores ''---'' se convierten a NULL y no se descartan registros. Del 2026-04-19
      al 2026-10-29: 182 de 194 días con datos (93.8 %) y 16998 de 18624 registros esperados (91.3 %).
      Se esperan 96 registros por día; la mayoría de los días completos tiene 95 (ver limitaciones).'
  limitaciones_conocidas:
  - 'Presión barométrica no homogénea: hasta el 2 de julio de 2026 la consola reportó presión reducida
    al nivel del mar (≈762–774 mmHg) y desde el 4 de julio presión absoluta de la estación (≈572–582 mmHg);
    el 3 de julio no hay datos. No se ha aplicado ninguna corrección: analizar los dos periodos por separado.'
  - La columna presion_hpa (y variacion_hpa) está en mmHg, la unidad configurada en la consola, no en
    hPa.
  - Temperatura y humedad relativa se reportan sin decimales (resolución efectiva de 1 °C y 1 %).
  - El registro de las 00:00 h de cada día no se captura, por lo que la mayoría de los días completos
    tiene 95 registros en lugar de 96.
  - 'Hay días sin datos o incompletos: la puesta en marcha (24 de abril al 2 de mayo de 2026) y los días
    7, 15 y 16 de septiembre de 2026, que no pudieron recuperarse.'
  - 'Viento: el 65 % de los intervalos registra 0 km/h y el 31 % no tiene dirección (calma); el anemómetro
    podría estar resguardado, por lo que los datos reflejan la circulación local.'
  - 'Dirección del viento: en parte de los registros las columnas direccion y direccion_rafaga están intercambiadas
    (error de ingesta identificado y pendiente de corrección).'
  - Radiación solar, índice UV y evapotranspiración no están disponibles (sensores no instalados) y no
    se incluyen en las vistas limpias.
  - Aún no se aplica en la base de datos la verificación de rangos físicos ni el marcado de valores atípicos;
    una verificación externa al 18 de octubre de 2026 no encontró valores fuera de rango en temperatura,
    humedad, precipitación ni viento.
entidades_atributos:
  descripcion_general: '5 vistas temáticas en CSV mensual. Cada registro es una medición de 15 minutos.
    Unidades: temperatura en °C, humedad relativa en %, presión en mmHg, velocidad del viento en km/h,
    precipitación en mm y tasa de precipitación en mm/h.'
  entidades:
  - archivo: AAAA/MM/clean_weather_AAAAMM.csv
    variables: Todas las variables limpias
    unidades: Varias
  - archivo: AAAA/MM/clean_temperatura_AAAAMM.csv
    variables: temp_exterior, temp_max, temp_min, temp_interior, humedad_exterior, humedad_interior
    unidades: °C, %
  - archivo: AAAA/MM/clean_viento_AAAAMM.csv
    variables: velocidad_kmh, rafaga_kmh, direccion, direccion_rafaga
    unidades: km/h
  - archivo: AAAA/MM/clean_lluvia_AAAAMM.csv
    variables: lluvia_mm, tasa_mm_hr
    unidades: mm, mm/h
  - archivo: AAAA/MM/clean_presion_AAAAMM.csv
    variables: presion_hpa (en realidad mmHg), variacion_hpa, tendencia
    unidades: mmHg
  cita_detalle: Ver README.md en la raíz del repositorio para la descripción de campos, unidades y limitaciones
